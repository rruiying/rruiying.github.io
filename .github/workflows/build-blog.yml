name: Build blog

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/build_posts.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install markdown pyyaml pymdown-extensions pillow

      - run: python scripts/build_posts.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts posts.js sitemap.xml
          if git diff --cached -I'"mtime":' --quiet; then
            echo "nothing to commit"
          else
            git commit -m "build: regenerate blog pages"
            git push
          fi
