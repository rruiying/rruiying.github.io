<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Rui Ying</title>
    <meta name="description" content="Notes, course write-ups and reading logs by Rui Ying.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&family=Source+Sans+3:wght@300;400;600&family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script>(function(){try{var t=localStorage.getItem("theme");if(!t&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches){t="dark";}if(t==="dark"){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}})();</script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="topnav">
        <div class="topnav-inner">
            <ul class="topnav-links">
                <li><a href="index.html#about">About me</a></li>
                <li><a href="index.html#news">News</a></li>
                <li><a href="index.html#publications">Publications</a></li>
                <li><a class="active" href="blog.html">Blog</a></li>
            </ul>
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="开灯 / 关灯">🌙</button>
        </div>
    </nav>

    <div class="page-wrapper narrow">
        <main class="main-content">

            <header class="blog-header">
                <h1 class="blog-title">Blog</h1>
                <p class="blog-subtitle">Course notes, paper summaries and things worth remembering.</p>
            </header>

            <div class="blog-layout">

                <!-- Folder tree -->
                <aside class="blog-tree" aria-label="Post folders">
                    <div class="blog-tree-title">FOLDERS</div>
                    <div id="blog-tree"></div>
                </aside>

                <!-- List -->
                <section>
                    <div class="blog-controls">
                        <input type="search" id="blog-search" class="blog-search"
                               placeholder="Search…" autocomplete="off" aria-label="Search posts">
                        <select id="blog-sort" class="blog-sort" aria-label="Sort posts">
                            <option value="date-desc">Newest first</option>
                            <option value="date-asc">Oldest first</option>
                            <option value="title-asc">Title A–Z</option>
                            <option value="title-desc">Title Z–A</option>
                        </select>
                    </div>
                    <div class="blog-count" id="blog-count"></div>
                    <div class="blog-list" id="blog-list"></div>
                    <div class="blog-pager" id="blog-pager"></div>
                </section>

            </div>

        </main>

        <footer class="page-footer">
            &copy; 2026 Rui Ying &middot; Munich, Germany
        </footer>
    </div>

    <script src="posts.js"></script>
    <script>
    (function () {
        "use strict";

        var treeEl   = document.getElementById("blog-tree");
        var listEl   = document.getElementById("blog-list");
        var countEl  = document.getElementById("blog-count");
        var searchEl = document.getElementById("blog-search");
        var sortEl   = document.getElementById("blog-sort");

        var posts = (typeof POSTS !== "undefined" ? POSTS : []).slice();
        var activeFolder = "All";
        var pagerEl = document.getElementById("blog-pager");
        var PAGE_SIZE = 8;
        var curPage = 1;

        function cats(p) {
            var c = p.categories || (p.category ? [p.category] : []);
            return c.length ? c : ["Uncategorised"];
        }

        // ── Folder tree (folders only, hierarchical via "/") ─────────────
        function segsOf(path) {
            return path.split("/").map(function (x) { return x.trim(); }).filter(Boolean);
        }

        function inFolder(p, path) {
            if (path === "All") { return true; }
            return cats(p).some(function (c) {
                var norm = segsOf(c).join("/");
                return norm === path || norm.indexOf(path + "/") === 0;
            });
        }

        function countFor(path) {
            return posts.filter(function (p) { return inFolder(p, path); }).length;
        }

        var rootChildren = {};
        posts.forEach(function (p) {
            cats(p).forEach(function (c) {
                var node = rootChildren;
                var acc = [];
                segsOf(c).forEach(function (seg) {
                    acc.push(seg);
                    node[seg] = node[seg] || { path: acc.join("/"), children: {} };
                    node = node[seg].children;
                });
            });
        });

        function setActive(path) {
            activeFolder = path;
            curPage = 1;
            Array.prototype.forEach.call(
                treeEl.querySelectorAll(".tree-item"),
                function (el) {
                    el.classList.toggle("active", el.getAttribute("data-folder") === path);
                }
            );
            render();
        }

        function folderButton(label, path, hasChildren, icon) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "tree-item";
            btn.setAttribute("data-folder", path);
            var caret = document.createElement("span");
            caret.className = "tree-caret";
            caret.textContent = hasChildren ? "▸" : "";
            btn.appendChild(caret);
            var ic = document.createElement("span");
            ic.className = "tree-icon";
            ic.textContent = icon;
            btn.appendChild(ic);
            var nm = document.createElement("span");
            nm.className = "tree-name";
            nm.textContent = label;
            nm.title = label;
            btn.appendChild(nm);
            var ct = document.createElement("span");
            ct.className = "tree-count";
            ct.textContent = countFor(path);
            btn.appendChild(ct);
            return btn;
        }

        function buildNode(name, info, container) {
            var kids = Object.keys(info.children).sort();
            var wrap = document.createElement("div");
            wrap.className = "tree-node open";

            var btn = folderButton(name, info.path, kids.length > 0, "📁");
            btn.addEventListener("click", function () {
                if (activeFolder === info.path) {
                    wrap.classList.toggle("open");   // second click folds / unfolds
                } else {
                    wrap.classList.add("open");
                    setActive(info.path);
                }
            });
            wrap.appendChild(btn);

            if (kids.length) {
                var inner = document.createElement("div");
                inner.className = "tree-children";
                kids.forEach(function (k) { buildNode(k, info.children[k], inner); });
                wrap.appendChild(inner);
            }
            container.appendChild(wrap);
        }

        function buildTree() {
            var all = folderButton("All posts", "All", false, "🗂");
            all.classList.add("active");
            all.addEventListener("click", function () { setActive("All"); });
            treeEl.appendChild(all);
            Object.keys(rootChildren).sort().forEach(function (k) {
                buildNode(k, rootChildren[k], treeEl);
            });
        }

        // ── List ─────────────────────────────────────────────────────────
        function haystack(p) {
            return [p.title, p.summary].concat(cats(p)).concat(p.tags || [])
                .join(" ").toLowerCase();
        }

        function formatDate(iso) {
            var d = new Date(iso + "T00:00:00");
            if (isNaN(d)) { return iso; }
            return d.toLocaleDateString("en-GB", { year: "numeric", month: "short", day: "numeric" });
        }

        function moddate(p) { return p.mtime || p.updated || p.date || ""; }

        var comparators = {
            "date-desc":  function (a, b) { return moddate(b).localeCompare(moddate(a)); },
            "date-asc":   function (a, b) { return moddate(a).localeCompare(moddate(b)); },
            "title-asc":  function (a, b) { return a.title.localeCompare(b.title); },
            "title-desc": function (a, b) { return b.title.localeCompare(a.title); }
        };

        function render() {
            var q = searchEl.value.trim().toLowerCase();
            var terms = q ? q.split(/\s+/) : [];

            var shown = posts.filter(function (p) {
                if (!inFolder(p, activeFolder)) { return false; }
                if (!terms.length) { return true; }
                var h = haystack(p);
                return terms.every(function (t) { return h.indexOf(t) !== -1; });
            });

            shown.sort(comparators[sortEl.value] || comparators["date-desc"]);
            listEl.innerHTML = "";
            pagerEl.innerHTML = "";

            if (!shown.length) {
                var none = document.createElement("p");
                none.className = "empty-note";
                none.textContent = posts.length ? "No posts match." : "No posts yet.";
                listEl.appendChild(none);
                countEl.textContent = "";
                return;
            }

            countEl.textContent = shown.length + (shown.length === 1 ? " post" : " posts") +
                (activeFolder !== "All" ? " in " + segsOf(activeFolder).pop() : "");

            var pages = Math.ceil(shown.length / PAGE_SIZE);
            if (curPage > pages) { curPage = pages; }
            var pageItems = shown.slice((curPage - 1) * PAGE_SIZE, curPage * PAGE_SIZE);

            pageItems.forEach(function (p) {
                var art = document.createElement("article");
                art.className = "post-item";

                var meta = document.createElement("div");
                meta.className = "post-meta";
                var bits = [formatDate(p.date)];
                if (p.updated && p.updated > p.date) {
                    bits[0] += " (updated " + formatDate(p.updated) + ")";
                }
                bits.push(cats(p).map(function (c) { return segsOf(c).join(" › "); }).join(", "));
                if (p.minutes) { bits.push(p.minutes + " min read"); }
                meta.textContent = bits.join("  ·  ");
                art.appendChild(meta);

                var h = document.createElement("h3");
                h.className = "post-title";
                var a = document.createElement("a");
                a.href = p.url;
                a.textContent = p.title;
                h.appendChild(a);
                art.appendChild(h);

                if (p.summary) {
                    var sm = document.createElement("p");
                    sm.className = "post-summary";
                    sm.textContent = p.summary;
                    art.appendChild(sm);
                }

                if (p.tags && p.tags.length) {
                    var tw = document.createElement("div");
                    tw.className = "post-tags";
                    p.tags.forEach(function (t) {
                        var tag = document.createElement("span");
                        tag.className = "tag";
                        tag.textContent = t;
                        tw.appendChild(tag);
                    });
                    art.appendChild(tw);
                }

                listEl.appendChild(art);
            });

            if (pages > 1) { buildPager(pages); }
        }

        function pagerButton(label, page, opts) {
            var b = document.createElement("button");
            b.type = "button";
            b.textContent = label;
            if (opts && opts.current) { b.className = "current"; }
            if (opts && opts.disabled) { b.disabled = true; }
            else {
                b.addEventListener("click", function () {
                    curPage = page;
                    render();
                    listEl.scrollIntoView({ behavior: "smooth", block: "start" });
                });
            }
            return b;
        }

        function buildPager(pages) {
            pagerEl.appendChild(pagerButton("←", curPage - 1, { disabled: curPage === 1 }));
            for (var i = 1; i <= pages; i++) {
                pagerEl.appendChild(pagerButton(String(i), i, { current: i === curPage }));
            }
            pagerEl.appendChild(pagerButton("→", curPage + 1, { disabled: curPage === pages }));
        }

        buildTree();
        searchEl.addEventListener("input", function () { curPage = 1; render(); });
        sortEl.addEventListener("change", function () { curPage = 1; render(); });
        render();
    })();
    </script>


    <script>
    (function () {
        var btn = document.getElementById("theme-toggle");
        if (!btn) { return; }
        function mode() { return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light"; }
        function paint() { btn.textContent = mode() === "dark" ? "\u2600\ufe0f" : "\ud83c\udf19"; }
        btn.addEventListener("click", function () {
            var next = mode() === "dark" ? "light" : "dark";
            if (next === "dark") { document.documentElement.setAttribute("data-theme", "dark"); }
            else { document.documentElement.removeAttribute("data-theme"); }
            try { localStorage.setItem("theme", next); } catch (e) {}
            paint();
        });
        paint();
    })();
    </script>
</body>
</html>
